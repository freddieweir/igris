name: 🔐 Secret Detection

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  gitleaks:
    name: GitLeaks Secret Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Create GitLeaks config
      run: |
        cat > .gitleaks.toml << 'EOF'
        title = "Carian Observatory GitLeaks Config"

        [extend]
        useDefault = true

        [[rules]]
        description = "OpenAI API Key"
        id = "openai-api-key"
        regex = '''sk-[a-zA-Z0-9]{48}'''

        [[rules]]
        description = "Anthropic Claude API Key"
        id = "claude-api-key"
        regex = '''sk-ant-api[0-9]{2}-[a-zA-Z0-9_-]{95}'''

        [[rules]]
        description = "ElevenLabs API Key"
        id = "elevenlabs-api-key"
        regex = '''[a-fA-F0-9]{32}'''

        [[rules]]
        description = "1Password Connect Token"
        id = "onepassword-connect"
        regex = '''eyJ[A-Za-z0-9_-]*\.eyJ[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*'''

        [[rules]]
        description = "Base64 Encoded Secrets"
        id = "base64-secrets"
        regex = '''(?i)(secret|password|token|key)["']?\s*[:=]\s*["']?[A-Za-z0-9+/]{32,}={0,2}["']?'''

        [[rules]]
        description = "JWT Tokens"
        id = "jwt-token"
        regex = '''eyJ[A-Za-z0-9_-]*\.eyJ[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*'''

        [[rules]]
        description = "Private SSH Keys"
        id = "private-ssh-key"
        regex = '''-----BEGIN (RSA |OPENSSH |DSA |EC |PGP )?PRIVATE KEY-----'''

        [[rules]]
        description = "Database URLs with credentials"
        id = "database-url"
        regex = '''(postgres|mysql|mongodb)://[^:]+:[^@]+@[^/]+'''

        # Corporate domain check (critical) - will be dynamically set
        [[rules]]
        description = "Production Domain Exposure"
        id = "production-domain"
        regex = '''corporateseas\.com'''

        [allowlist]
        description = "Allowlist for false positives"
        regexes = [
            '''\{\{\s*op://[^}]+\}\}''',
            '''\$\{[A-Z_]+\}''',
            '''yourdomain\.com'''
        ]
        paths = [
            '''\.gitleaks\.toml''',
            '''\.github/workflows/.*'''
        ]
        EOF

    - name: Run GitLeaks
      run: |
        # Install gitleaks using official release
        wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz
        tar xzf gitleaks_8.18.0_linux_x64.tar.gz
        sudo mv gitleaks /usr/local/bin/

        # Run gitleaks on the current branch (allow no findings for template repo)
        gitleaks detect --config=.gitleaks.toml --verbose --no-git || true

  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: TruffleHog OSS
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.before || 'HEAD~1' }}
        head: ${{ github.sha }}
        extra_args: --debug --only-verified
      if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')

    - name: TruffleHog OSS (Full scan for new repository)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        extra_args: --debug --only-verified
      if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'