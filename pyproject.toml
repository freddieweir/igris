[project]
name = "igris"
version = "2.1.0"
description = "YubiKey FIDO2 authentication service for LAN-based security enforcement"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "fido2>=1.2.0",
    "pydantic-settings>=2.7.0",
    "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
sqlcipher = [
    "pysqlcipher3>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/igris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "pip-audit>=2.7.0",
]
