# YubiKey Git Enforcement Configuration
# Managed by igris/scripts/hardware-git-setup.sh
# Last updated: 2026-02-14

enforcement:
  enabled: true                # Master switch for YubiKey enforcement
  require_tap: true            # Require physical tap (vs just presence)
  timeout_seconds: 30          # How long to wait for tap
  retry_attempts: 3            # Failed attempts before lockout warning

yubikey:
  slot: 1                       # OTP slot for HMAC-SHA1 challenge-response
  # Override with IGRIS_OTP_SLOT env var
  # Slot 1 = HMAC-SHA1 challenge-response (primary, short tap)
  # Slot 2 = Static password (backup auth, long press)

verification:
  method: yubikey              # auto, yubikey
  # yubikey: YubiKey Slot 1 HMAC first, then Slot 2 backup password if enabled
  # auto: Same as yubikey (backup password fallback if enabled)

  # Touch ID has been removed — replaced by backup password (YubiKey Slot 2)
  # touchid: DEPRECATED — see backup_password below

  backup_password:
    enabled: true              # Allow YubiKey Slot 2 static password as fallback
    hash_file: ~/.config/igris/backup-auth.hash  # PBKDF2-SHA256 hash of static password
    session_file: ~/.config/igris/session-cache
    session_minutes: 5         # How long a successful backup auth session lasts
    max_attempts: 3            # Failed attempts before lockout
    priority: 2                # Try after YubiKey Slot 1 HMAC (1)
    # Setup: ./scripts/backup-password-setup.sh setup
    # The static password on Slot 2 (long press) should be identical across all YubiKeys

  cache:
    enabled: true              # Enable verification caching (reduces double-tap)
    window_seconds: 5          # Cache validity window (conservative for security)
    cache_file: ~/.tomb-verification-cache
    # How it works:
    #   - After successful YubiKey tap, verification is cached for 5 seconds
    #   - Subsequent verifications (e.g., git hook after wrapper) reuse cache
    #   - Cache includes operation context (repo + operation + remote)
    #   - Prevents bypass by requiring YubiKey serial match
    # Security:
    #   - Short window minimizes attack surface
    #   - Context-specific (different repos/operations don't reuse)
    #   - Cryptographic hash prevents cache replay attacks

  challenge_length: 32         # Bytes for challenge generation
  log_verifications: true      # Log all verification attempts

operations:
  git:
    push: required             # required, optional, disabled
    pull: required
    fetch: required
    clone: required
    remote_add: optional       # May not need verification
    submodule_update: required

  gh:
    pr_create: required
    pr_merge: required
    release_create: required
    repo_clone: required
    issue_create: optional     # Less sensitive
    workflow_run: required

exemptions:
  # Repositories that don't require enforcement
  repos: []
  # Example: ["/path/to/public-repo", "/path/to/test-repo"]

  # Operations that don't require enforcement
  operations: []
  # Example: ["git pull", "gh issue create"]

  # Time-based exemption (after verification)
  cached_duration_minutes: 0   # 0 = require tap every time
  # Setting to 5 means: tap once, operations allowed for 5 min

security:
  alert_on_bypass_attempt: true
  log_file: ~/.tomb-yubikey-verifications.log
  max_failed_attempts: 5       # Before alerting
  alert_command: "osascript -e 'display notification \"YubiKey verification failed multiple times\" with title \"Security Alert\" sound name \"Basso\"'"

audio:
  enabled: true                # Play sound when YubiKey tap required
  custom_sound_path: assets/audio/AlbedoYubikeyTapRequired.wav  # Path relative to TOMB_DIR
  fallback_system_sound: Tink  # System sound if custom file not found (Glass, Tink, Pop, Purr, Basso)

integration:
  fortify_managed: true
  auto_update_hooks: true      # Update hooks when fortify updates
  workspace_repos:
    - $GIT_ROOT/internal/repos/tomb-of-nazarick
    - $GIT_ROOT/internal/repos/carian-observatory
    - $GIT_ROOT/internal/repos/fifth-symphony
    - $GIT_ROOT/internal/repos/EchoLink-Reborn
    - $GIT_ROOT/internal/repos/carian-constellation

# Dangerous Shell Command Protection
# Extends YubiKey verification to destructive shell commands (rm -rf, etc.)
dangerous_commands:
  enabled: true
  environment: main_only       # main_only | all (VM passes through)
  # main_only: Only enforce on main machine (detected via $USER)
  # all: Enforce everywhere (not recommended - VM is sandbox)

  rm:
    enabled: true
    # Dangerous flag patterns that trigger verification
    dangerous_patterns:
      - "-rf"                  # rm -rf anything
      - "-r.*-f"               # rm -r with -f anywhere
      - "-fr"                  # rm -fr variant
      - "-f.*-r"               # rm -f with -r anywhere
    # Protected paths - operations targeting these require verification
    protected_paths:
      - "/"                    # root
      - "~"                    # home (literal tilde)
      - "$HOME"                # home expanded
      - "/Users"               # all users
      - "/System"              # macOS system
      - "/usr"                 # unix system
      - "/opt"                 # homebrew root
      - "/Applications"        # macOS apps
      - "/Library"             # system library
    protection_level: required # required | warn_only

  # Future: Additional commands can be added here
  # sudo:
  #   enabled: false
  #   dangerous_subcommands: [rm, chmod, chown, dd, mkfs]
  # chmod:
  #   enabled: false
  #   dangerous_patterns: ["777", "-R.*777", "000"]

# Docker Operation Gating
# Extends YubiKey verification to Docker commands based on risk level
docker:
  enabled: true
  environment: main_only       # main_only | all (VM passes through)
  # Policy file location (defaults to ~/.config/igris/policy.yaml)
  policy_file: ~/.config/igris/policy.yaml

devices:
  # Multiple YubiKeys can be registered for redundancy
  # Set via IGRIS_YUBIKEY_SERIALS env var or 1Password
  # Example: allowed_serials: [12345678]
  allowed_serials: []

  require_specific_device: false  # Allow any from list
